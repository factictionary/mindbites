name: Update index.json

on:
  push:
    paths:
      - 'data/**.json'
  workflow_dispatch:

jobs:
  update-index:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2   # pinned — Node 24 compatible

      - name: Regenerate index.json
        run: |
          python3 - << 'PYEOF'
          import json
          from pathlib import Path

          data_dir = Path('data')
          files = sorted(
              p.name
              for p in data_dir.glob('*.json')
              if p.name != 'index.json'
          )

          index_path = data_dir / 'index.json'
          index_path.write_text(
              json.dumps(files, indent=2, ensure_ascii=False) + '\n'
          )

          print(f'index.json updated with {len(files)} file(s):')
          for f in files:
              print(f'  {f}')
          PYEOF

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/index.json
          # Only commit if index.json actually changed
          git diff --cached --quiet && echo "No changes to index.json" || (
            git commit -m "🤖 Auto-update index.json [skip ci]" &&
            git push
          )